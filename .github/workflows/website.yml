name: Deploy CardMe website
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cardme-website-production
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/build-website.py
      - run: python3 tests/website-check.py
      - run: node tests/website-metrics-check.mjs
      - run: node tests/website-totals-check.mjs
      - uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: website/dist
          skip_app_build: true
          skip_api_build: true
          production_branch: main
